server {
    listen 80 default_server;
    server_name wwc.kiservicehub.de _;

    root /srv/wwc/current/apps/api/public;
    index index.php;

    client_max_body_size 100M;
    access_log /var/log/nginx/wwc-access.log;
    error_log  /var/log/nginx/wwc-error.log;

    # --- GitHub Deploy-Webhook ---
    location = /deploy-hook {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Isolierte Dev-Kopien: WordPress-PHP darf nicht an Laravel-FPM.
    location ^~ /clone/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    # --- Laravel API ---
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /storage {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # --- Next.js Portal ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
