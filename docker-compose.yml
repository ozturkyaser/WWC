services:
  api:
    build: ./apps/api
    command: php artisan serve --host=0.0.0.0 --port=8080
    ports:
      - "8082:8080"
    volumes:
      - ./apps/api:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Laravel-Scheduler: fuehrt die geplanten Aufgaben aus (Scans, KI-Wartung, Abrechnung)
  scheduler:
    build: ./apps/api
    command: php artisan schedule:work
    volumes:
      - ./apps/api:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Queue-Worker: verarbeitet Hintergrund-Jobs (Agent-Kommandos, Wartungs-Pipeline, Mails)
  worker:
    build: ./apps/api
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=300
    volumes:
      - ./apps/api:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wwc
      POSTGRES_USER: wwc
      POSTGRES_PASSWORD: wwc_secret
    ports:
      - "5434:5432"
    volumes:
      - wwc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwc -d wwc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # Local WordPress for pairing tests (same Docker network as api)
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wwc_wp:/var/www/html
      - ./packages/wp-agent:/var/www/html/wp-content/plugins/wwc-agent
    depends_on:
      - wordpress-db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  wordpress-db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - wwc_wp_db:/var/lib/mysql

volumes:
  wwc_pg:
  wwc_wp:
  wwc_wp_db:
